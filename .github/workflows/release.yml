name: Release

# Builds the Windows NSIS installer and an unsigned universal macOS .dmg (+ .app.tar.gz update bundle) for The Bridge, signs the in-app updater
# artifacts with TAURI_SIGNING_PRIVATE_KEY and publishes a GitHub Release on
# this repository with latest.json (the endpoint installed copies poll:
# releases/latest/download/latest.json).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.2); defaults to v<version> from tauri.conf.json'
        required: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: '--bundles nsis'
            targets: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin --bundles app,dmg'
            targets: 'aarch64-apple-darwin x86_64-apple-darwin'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Rust toolchain (rust-toolchain.toml)
        shell: bash
        run: |
          rustup show
          for t in ${{ matrix.targets }}; do rustup target add "$t"; done
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.platform }}
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event.inputs.tag || (github.ref_type == 'tag' && github.ref_name) || 'v__VERSION__' }}
          releaseName: 'The Bridge __VERSION__'
          releaseBody: 'Windows installer (.exe) and macOS disk image (.dmg, unsigned: right-click > Open the first time) for The Bridge. Based on OpenAlgo Desktop (AGPL-3.0). Source: https://github.com/${{ github.repository }}'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: '${{ matrix.args }} --config {"bundle":{"createUpdaterArtifacts":true}}'
